[package]
name = "nite"
version = "0.1.0"
edition = "2024"
description = "Declarative Minecraft instance launcher for NixOS"
license = "AGPL-3.0-or-later"
repository = "https://github.com/thelevnet/nite"
homepage = "https://github.com/thelevnet/nite"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v3"] }
xdg = "3.0.0"
md-5 = "0.10.6"
rayon = "1.10"
toml = "1.1.6"

